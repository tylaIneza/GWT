version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gwt_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: codeplatform
      MYSQL_USER: codearena
      MYSQL_PASSWORD: codearena123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "codearena", "--password=codearena123"]
      interval: 10s
      timeout: 5s
      retries: 10

  code-runner:
    build:
      context: ./code-runner
      dockerfile: Dockerfile
    container_name: gwt_code_runner
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3001
      - MAX_CONCURRENT_EXECUTIONS=10
      - EXECUTION_TIMEOUT_MS=10000
    privileged: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gwt_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=codearena
      - DB_PASSWORD=codearena123
      - DB_NAME=codeplatform
      - JWT_SECRET=change-this-in-production-min-32-chars-long
      - JWT_EXPIRES_IN=7d
      - CODE_RUNNER_URL=http://code-runner:3001
      - FRONTEND_URL=http://localhost:3000
      # Mobile Money (Rwanda)
      - MTN_BASE_URL=https://sandbox.momodeveloper.mtn.com
      - MTN_SUBSCRIPTION_KEY=your-mtn-subscription-key
      - MTN_API_USER=your-api-user-uuid
      - MTN_API_KEY=your-api-key
      - AIRTEL_BASE_URL=https://openapi.airtel.africa
      - AIRTEL_CLIENT_ID=your-airtel-client-id
      - AIRTEL_CLIENT_SECRET=your-airtel-client-secret
      # International Payments
      - STRIPE_SECRET_KEY=your-stripe-secret-key
      - STRIPE_WEBHOOK_SECRET=your-stripe-webhook-secret
      - PAYPAL_CLIENT_ID=your-paypal-client-id
      - PAYPAL_CLIENT_SECRET=your-paypal-client-secret
      - PAYPAL_MODE=sandbox
      # Crypto
      - CRYPTO_WALLET_BTC=your-btc-wallet-address
      - CRYPTO_WALLET_USDT=your-usdt-wallet-address
    depends_on:
      mysql:
        condition: service_healthy
      code-runner:
        condition: service_started

volumes:
  mysql_data:
